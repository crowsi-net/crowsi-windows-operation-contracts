[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-windows-operation-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = ["ecosystem-private"]

license = "Apache-2.0"
repository = "https://github.com/crowsi-net/crowsi-windows-operation-contracts"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crowsi-credential-authority-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
hex = "=0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
nix = { version = "=0.29.0", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "pa_authorize_once"
path = "tests/pa_authorize_once.rs"
